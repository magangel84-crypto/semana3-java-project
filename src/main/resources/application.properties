# =============================================================================
# Aplicacion login (Spring Boot 4.1.1 - WAR ejecutable con JSP)
# =============================================================================
spring.application.name=login

# Puerto (override en runtime: --server.port=9090 o PORT=9090)
server.port=${PORT:8080}

# Context path: mantiene la URL historica http://localhost:8080/login/
server.servlet.context-path=/login

# Sesion
server.servlet.session.timeout=15m
server.servlet.session.cookie.http-only=true
# Endurecimiento: prohibe el seguimiento de sesion por URL (;jsessionid=...),
# que filtraria el ID de sesion en logs, historiales y cabecera Referer.
server.servlet.session.tracking-modes=cookie

# Vistas JSP: /WEB-INF/jsp/<vista>.jsp
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# Credenciales demo. En un entorno real NO se ponen aqui:
# se inyectan por variables de entorno (o AWS Secrets Manager en el laboratorio).
app.security.username=${APP_SECURITY_USERNAME:demo}
app.security.password=${APP_SECURITY_PASSWORD:Demo1234}

# Mensajes de error acotados (no exponer stack traces en el navegador)
server.error.include-message=never
server.error.include-stacktrace=never
